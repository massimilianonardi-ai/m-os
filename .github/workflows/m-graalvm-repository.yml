name: GraalVM package repository integration

on:
  push:
    branches: [master, codex/graalvm-repository-adapter]
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/m-graalvm-repository.yml
      - .github/scripts/m-graalvm-diagnostics-test.sh
      - lib/sys/sh/pkg/repository/pkg-repository-graalvm.lib.sh
      - res/sys/manual/pkg-repository-graalvm.lib.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graalvm-public-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout the pinned package catalog
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 0b69223a5ebe7bc042aad50012ee8bc7e4a00442
          path: catalog
          persist-credentials: false
      - name: Configure isolated runtime to use pinned catalog
        shell: sh
        run: |
          set -eu
          ./m osarch update
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
      - name: Check operation-specific upstream request diagnostics
        shell: sh
        run: |
          set -eu
          sh -n .github/scripts/m-graalvm-diagnostics-test.sh
          GRAALVM_DIAGNOSTIC_TMP_BASE="$GITHUB_WORKSPACE/.graalvm-diagnostic-test" \
            SHELL=/bin/sh ./m shell -c '. .github/scripts/m-graalvm-diagnostics-test.sh'
      - name: Resolve exact and stable-latest package requests
        shell: sh
        run: |
          set -eu
          ./m pkg depend graalvm@25.3.4.1 >/dev/null
          ./m pkg depend graalvm >/dev/null
      - name: Install exact anchor and stable latest through public pkg
        shell: sh
        run: |
          set -eu
          ./m pkg install graalvm
          latest=$(./m pkg default graalvm)
          case "$latest" in graalvm@* ) : ;; *) echo 'unversioned install did not select a GraalVM concrete' >&2; exit 1 ;; esac
          ./m pkg install graalvm@25.3.4.1
          osarch=$(./m osarch)
          versions=$(./m pkg versions graalvm)
          printf '%s\n' "$versions"
          case "$versions" in *"graalvm@25.3.4.1!$osarch"*) : ;; *) echo 'exact GraalVM anchor install missing' >&2; exit 1 ;; esac
          case "$versions" in *"$latest"*) : ;; *) echo 'selected latest concrete is not installed' >&2; exit 1 ;; esac
          ./m pkg provider default java "$latest"
          ./m java -version
          echo 'PASS: exact and stable-latest GraalVM releases installed through public pkg'
