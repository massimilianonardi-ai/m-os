name: Build host-specific m distributions

on:
  push:
    branches: [master, codex/srv-persistent-supervisor]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            osarch: linux-x86_64
          - os: ubuntu-24.04-arm
            osarch: linux-arm64
          - os: macos-15-intel
            osarch: macos-x86_64
          - os: macos-15
            osarch: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify the current-host source distribution
        shell: sh
        env:
          EXPECTED_OSARCH: ${{ matrix.osarch }}
        run: |
          set -eu
          ./tools/package-m-distribution.sh
          test -f "dist/m-os-$EXPECTED_OSARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: m-os-${{ matrix.osarch }}
          path: dist/m-os-${{ matrix.osarch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
