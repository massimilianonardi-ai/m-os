name: m context shell command selection

on:
  push:
    branches: [master, codex/c3-approved-generalized-context]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real m bootstrap and POSIX context function
        shell: sh
        run: |
          .github/scripts/m-context-shell-public.sh
      - name: Account-scoped context defaults and hostile-input checks
        shell: sh
        run: |
          set -eu
          ./m sh .github/scripts/context-store-test.sh
      - name: Installation-managed system-profile registry validation
        shell: sh
        run: |
          set -eu
          ./m sh .github/scripts/context-profile-registry-test.sh
      - name: System state selector escape refusal
        shell: sh
        run: |
          set -eu
          ./m sh .github/scripts/state-selector-security-test.sh
      - name: Real package integration and runtime-specific library lookup
        shell: sh
        run: |
          ./m sh .github/scripts/context-libraries-test.sh
      - name: Context profile and protected package launch checks
        shell: sh
        run: |
          set -eu
          ./m sh .github/scripts/context-profile-launch-state-test.sh
