name: m standalone JSON command

on:
  push:
    paths:
      - '.github/scripts/m-json-public.sh'
      - '.github/scripts/m-json-test-parsing.sh'
      - '.github/workflows/m-json-public.yml'
      - 'bin/sys/json'
      - 'res/sys/manual/json'
      - '.github/scripts/m-json-test-parsing.sh'
  pull_request:
    paths:
      - '.github/scripts/m-json-public.sh'
      - '.github/scripts/m-json-test-parsing.sh'
      - '.github/workflows/m-json-public.yml'
      - 'bin/sys/json'
      - 'res/sys/manual/json'
      - '.github/scripts/m-json-test-parsing.sh'
  workflow_dispatch:

jobs:
  public-json:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: |
          sh -n bin/sys/json
          sh -n .github/scripts/m-json-public.sh
      - name: Exercise standalone public command
        run: .github/scripts/m-json-public.sh

  json-test-parsing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned JSONTestSuite corpus
        run: |
          git clone --filter=blob:none https://github.com/nst/JSONTestSuite.git "$RUNNER_TEMP/JSONTestSuite"
          git -C "$RUNNER_TEMP/JSONTestSuite" checkout --detach 1ef36fa01286573e846ac449e8683f8833c5b26a
      - name: Check POSIX shell syntax
        run: sh -n .github/scripts/m-json-test-parsing.sh
      - name: Validate JSONTestSuite test_parsing
        run: .github/scripts/m-json-test-parsing.sh "$RUNNER_TEMP/JSONTestSuite/test_parsing"
