name: m A2 shell language manual and diagnostic public validation

on:
  push:
    branches: [master]
    paths:
      - m
      - bin/sys/shell
      - bin/sys/lang
      - bin/sys/lang-set
      - bin/sys/manual
      - bin/sys/log
      - bin/sys/pager
      - lib/sys/sh/base.lib.sh
      - lib/sys/sh/core.lib.sh
      - res/sys/lang/**
      - res/sys/manual/**
      - .github/workflows/m-shell-resources-public.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-shell-resources:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise real managed shell localization manual and diagnostics
        shell: sh
        run: |
          set -eu
          work=$(mktemp -d)
          cleanup() {
            ./m lang-set en_US >/dev/null 2>&1 || :
            if [ ! -L res/sys/lang/current ]; then
              rm -f -- res/sys/lang/current
              ln -s en_US res/sys/lang/current
            fi
            rm -rf -- "$work"
          }
          trap cleanup 0
          trap 'exit 130' HUP INT TERM

          # Exercise the native command and explicit library-loading boundaries.
          SHELL=/bin/sh ./m shell -c '
            test -n "$m_ROOT" &&
            test -n "$m_LIB_DIR" &&
            test -n "$m_STATE_SYS_DIR"
          '
          ./m sh -c '
            . "$m_LIB_DIR/sys/sh/core.lib.sh" || exit 1
            command -v loadlib >/dev/null || exit 1
            command -v loadsyslib >/dev/null || exit 1
            command -v context >/dev/null || exit 1
          '
          (
            unset m_ROOT
            if ./bin/sys/lang execution invalid-arguments >"$work/out" 2>"$work/err"
            then
              echo 'lang accepted an uninitialized host process' >&2
              exit 1
            fi
            [ ! -s "$work/out" ] && [ -s "$work/err" ]
          )

          # Current/fallback language is selected data, never executable shell.
          [ "$(./m lang-set)" = en_US ]
          expected=$(cat res/sys/lang/en_US/execution/invalid-arguments)
          [ "$(./m lang execution invalid-arguments)" = "$expected" ]
          [ "$(./m lang no-such-domain no-such-message)" = no-such-domain.no-such-message ]

          # Component identifiers are independently validated. Fallback is
          # resolved from data and catalog text is never evaluated.
          for pair in 'a .b' '.a b' 'a- b_' 'a b.'
          do
            set -- $pair
            if ./m lang "$1" "$2" >"$work/out" 2>"$work/err"; then
              echo "lang accepted invalid component pair: $pair" >&2
              exit 1
            else
              [ "$?" -eq 1 ]
            fi
            [ ! -s "$work/out" ]
          done
          mkdir -p res/sys/lang/en_US/a2fallback
          printf '%s\n' 'fallback-only-message' > res/sys/lang/en_US/a2fallback/message
          printf '%s\n' "\$(touch $work/catalog-executed)" > res/sys/lang/en_US/a2fallback/data
          ./m lang-set it_IT
          [ "$(./m lang a2fallback message)" = fallback-only-message ]
          [ "$(./m lang a2fallback data)" = "\$(touch $work/catalog-executed)" ]
          [ ! -e "$work/catalog-executed" ]
          ./m lang-set en_US
          rm -rf -- res/sys/lang/en_US/a2fallback

          # lang-set distinguishes argument, selector and preparation errors.
          if ./m lang-set en_US extra >"$work/out" 2>"$work/err"; then exit 1; else [ "$?" -eq 1 ]; fi
          grep -F '[language.argument-count-invalid]' "$work/err" >/dev/null
          mv res/sys/lang/current "$work/current-selector"
          if ./m lang-set >"$work/out" 2>"$work/err"; then exit 1; else [ "$?" -eq 3 ]; fi
          grep -F '[language.selector-invalid]' "$work/err" >/dev/null
          mv "$work/current-selector" res/sys/lang/current
          chmod 555 res/sys/lang
          if ./m lang-set it_IT >"$work/out" 2>"$work/err"; then
            chmod 755 res/sys/lang
            exit 1
          else
            status=$?
            chmod 755 res/sys/lang
            [ "$status" -eq 4 ]
          fi
          grep -F '[language.selector-preparation-failed]' "$work/err" >/dev/null
          [ "$(./m lang-set)" = en_US ]

          ./m lang-set it_IT
          [ "$(./m lang-set)" = it_IT ]
          expected_it=$(cat res/sys/lang/it_IT/execution/invalid-arguments)
          [ "$(./m lang execution invalid-arguments)" = "$expected_it" ]
          if ./m lang-set invalid_a2_locale >"$work/out" 2>"$work/err"
          then
            echo 'lang-set accepted an unconfigured locale' >&2
            exit 1
          else
            [ "$?" -eq 2 ]
          fi
          [ "$(./m lang-set)" = it_IT ]
          ./m lang-set en_US
          [ "$(./m lang-set)" = en_US ]

          # Discover and inspect the actual distributed operational manual.
          ./m manual > "$work/topics"
          grep -Fx 'sys shell' "$work/topics" >/dev/null
          grep -Fx 'sys lang-set' "$work/topics" >/dev/null
          ./m manual --no-pager sys shell > "$work/manual"
          cmp res/sys/manual/shell "$work/manual"
          ./m manual --no-pager core.lib.sh > "$work/core"
          cmp res/sys/manual/core.lib.sh "$work/core"
          if ./m manual --no-pager sys absent-a2-topic >"$work/out" 2>"$work/err"
          then
            echo 'manual accepted a nonexistent exact topic' >&2
            exit 1
          else
            [ "$?" -eq 2 ]
          fi
          [ ! -s "$work/out" ] && [ -s "$work/err" ]

          # Diagnostic filtering must preserve stdout and reject invalid
          # severity without accidentally emitting a normal message.
          m_LOG_LEVEL=warn ./m log warn execution invalid-arguments operation a2             >"$work/log-out" 2>"$work/log-err"
          [ ! -s "$work/log-out" ]
          grep -F '[warn] [execution.invalid-arguments]' "$work/log-err" >/dev/null
          m_LOG_LEVEL=off ./m log error execution invalid-arguments operation a2             >"$work/log-out" 2>"$work/log-err"
          [ ! -s "$work/log-out" ] && [ ! -s "$work/log-err" ]
          invalid_log() {
            expected_status=$1
            shift
            if m_LOG_LEVEL=off ./m log "$@" >"$work/out" 2>"$work/err"; then
              echo "log accepted invalid filtered invocation: $*" >&2
              exit 1
            else
              [ "$?" -eq "$expected_status" ] || {
                echo "log returned wrong status for invalid filtered invocation: $*" >&2
                exit 1
              }
            fi
          }
          invalid_log 4 info Bad msg
          invalid_log 5 info domain Bad.
          invalid_log 6 info domain message lone
          invalid_log 7 info domain message BadField value
          if m_LOG_LEVEL=unexpected ./m log info execution invalid-arguments >"$work/out" 2>"$work/err"; then
            exit 1
          else
            [ "$?" -eq 3 ]
          fi
          if ./m log a2-invalid execution invalid-arguments >"$work/out" 2>"$work/err"
          then
            echo 'log accepted an invalid severity' >&2
            exit 1
          else
            [ "$?" -eq 2 ]
          fi
          [ ! -s "$work/out" ] && [ -s "$work/err" ]

          echo 'PASS: real m A2 shell, language, manual, diagnostics'
