name: m real provider-backed srv lifecycle

on:
  push:
    branches: [master, m-os-completion-s]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  srv-ubuntu-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build portable srv supervisor
        shell: sh
        run: ./tools/build-srv-supervisor.sh
      - name: Exercise srv against actual published Electron web-control service
        shell: sh
        run: |
          .github/scripts/m-srv-provider-live.sh
