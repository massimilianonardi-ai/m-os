name: Validate real v1 Java catalog adapters on autonomous m

on:
  push:
    branches: [pkg-schema-v2]
    paths:
      - 'lib/sys/sh/pkg/repository/pkg-repository-apache-maven.lib.sh'
      - 'lib/sys/sh/pkg/repository/pkg-repository-temurin.lib.sh'
      - 'res/sys/manual/pkg-repository-apache-maven.lib.sh'
      - 'res/sys/manual/pkg-repository-temurin.lib.sh'
      - '.github/workflows/m-pkg-java-v1-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-catalog:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact autonomous m runtime
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned catalog containing unchanged v1 Java package definitions
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/pkg-catalog
          ref: 420e0870b81c77fb34cb125822ba76501516a35c
          path: catalog
          persist-credentials: false
      - name: Exercise real Java repository adapters and public pkg lifecycle
        shell: sh
        run: |
          set -eu
          sh -n lib/sys/sh/pkg/repository/pkg-repository-temurin.lib.sh
          sh -n lib/sys/sh/pkg/repository/pkg-repository-apache-maven.lib.sh
          ./m osarch update
          conf=$(./m state-path system sys pkg conf)
          mkdir -p -- "$conf"
          printf '%s\n' "$GITHUB_WORKSPACE/catalog" > "$conf/catalog"
          ./m sh -ec '
            . "$m_LIB_DIR/sys/sh/core.lib.sh"
            loadsyslib "pkg/repository/pkg-repository-apache-maven"
            repo="$GITHUB_WORKSPACE/catalog/v1/pkg/maven/$m_OSARCH/repository"
            versions=$(pkg_repository_list_versions "$repo")
            [ -n "$versions" ]
            printf "%s\n" "$versions" | LC_ALL=C grep "^4\\." >/dev/null
          '
          echo 'CHECKPOINT: real Apache Maven 4 repository index read'
          ./m pkg install temurin@21+35
          java_concrete=$(./m pkg default temurin)
          case "$java_concrete" in temurin@21+35!*) : ;; *) exit 1 ;; esac
          ./m pkg provider default java "$java_concrete"
          ./m java -version
          echo 'CHECKPOINT: real Temurin provider installed and executed'
          ./m pkg install maven
          maven_concrete=$(./m pkg default maven)
          case "$maven_concrete" in maven@4*) : ;; *) exit 1 ;; esac
          ./m mvn -version
          echo 'PASS: real v1 Temurin and Apache Maven adapters, managed Java provider and Maven CLI'
